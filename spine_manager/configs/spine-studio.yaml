schema_version: 1

project:
  id: roomwave-c010
  source_root: source
  reference_root: reference-corpus
  run_root: runs
  knowledge_root: knowledge
  capability_contract: configs/spine-4.3-capability-contract.json
  capability_contract_schema: schemas/spine-4.3-capability-contract.schema.json

versions:
  spine_editor: 4.3.26
  spine_runtime: 4.3.13
  compatibility_policy: explicit-matrix-required

workflow:
  mode: forensic
  operation_mode: assistant-operated
  model_runtime: external-assistant
  project_scripts_are: deterministic-tools-only
  default_source: source/nikke_4.3.26/derived/c010_roomwave_4.3.26
  mutate_only_derived_copy: true
  max_retries_per_failure_class: 3
  unknown_policy: block
  hard_gate_policy: fail-closed

semantic_targets:
  - hand_target_r
  - strap_target_r
  - gun_target
  - face_target
  - effect_anchor

quality:
  required_isolation_cases:
    - hand-only
    - strap-only
    - gun-only
    - hand-to-face
  required_runtime_cases:
    - idle
    - interrupt-and-recover
    - deterministic-replay
  visual_review: independent-evidence-only
  performance_review: required-before-promote

evolution:
  prompt_regression: true
  tool_regression: true
  agent_graph_regression: true
  keep_only_if_improved: true
